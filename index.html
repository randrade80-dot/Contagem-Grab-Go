<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle da Geladeira</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1f6f86">
<style>
:root{--bg:#f2f6f7;--card:#fff;--tx:#14262d;--mut:#5f7480;--pri:#1f6f86;--pt:#fff;--bd:#d3dfe3;--ok:#17703f;--okb:#dcf2e4;--bad:#a8231b;--badb:#fbe1de;--inp:#fff8cc;--sel:#e1eef2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c21;--card:#182a31;--tx:#e8f1f4;--mut:#9bb1ba;--pri:#5cb8d0;--pt:#08181d;--bd:#2b434c;--ok:#7fdca5;--okb:#17382a;--bad:#ff9a91;--badb:#44201d;--inp:#3a3817;--sel:#223c45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c21;--card:#182a31;--tx:#e8f1f4;--mut:#9bb1ba;--pri:#5cb8d0;--pt:#08181d;--bd:#2b434c;--ok:#7fdca5;--okb:#17382a;--bad:#ff9a91;--badb:#44201d;--inp:#3a3817;--sel:#223c45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif;max-width:640px;margin-inline:auto;padding:0 12px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:14px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button,.seg button{flex:1;padding:11px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:600 15px Arial,sans-serif}
nav button.on,.seg button.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.seg{display:flex;gap:6px;margin-top:10px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input[type=date],input[type=text]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px Arial,sans-serif}
.sum{display:flex;gap:8px;text-align:center}.sum b{overflow-wrap:anywhere}
.sum div{flex:1;background:var(--sel);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:20px}.sum span{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.nm{flex:1;min-width:0;font-weight:600}
.nm small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:12px;font-weight:700;margin-left:4px}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.bad{background:var(--badb);color:var(--bad)}
.st{display:flex;align-items:center;gap:6px}
.st button{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 22px Arial,sans-serif}
.st input{width:58px;height:44px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--inp);color:var(--tx);font:700 20px Arial,sans-serif}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:12px}
details{border-bottom:1px solid var(--bd);padding:8px 0}
summary{font-weight:700;cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pri);color:var(--pt);font:700 15px Arial,sans-serif;margin-top:8px}
.btn.alt{background:var(--sel);color:var(--tx)}
.del{width:auto;padding:0 12px;font-size:13px!important;color:var(--bad)!important}
.pr{display:flex;gap:6px;align-items:center;padding:6px 0}
.pr input{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px Arial,sans-serif}
.empty{color:var(--mut);text-align:center;padding:16px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<h1>🧊 Controle da Geladeira</h1>
<p class="sub">Conte à noite, conte de manhã, informe o vendido e veja a perda.</p>
<nav id="nav"></nav>
<div id="app"></div>
<div id="toast"></div>
<script>
const KEY='geladeira.v1';
const SEED=['Coca-Cola Original lata','Coca-Cola Zero lata','Guaraná Antarctica lata','Água Pouso Alto (tampa verde)','Água Pouso Alto (tampa azul)','H2O! (tampa verde)','H2OH! (tampa azul-claro)','Matte Leão copo','Guaravita copo','Garrafa tampa amarela','Garrafa tampa azul','Salada de frutas pote','Mousse pote','Torta/cheesecake pote','Doce de leite/creme pote'];
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.products)){S={products:SEED.map((n,i)=>({id:'p'+i,name:n})),days:{}}}
S.rep=S.rep||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const br=i=>i.split('-').reverse().join('/').slice(0,5);
const wd=i=>['dom','seg','ter','qua','qui','sex','sáb'][new Date(i+'T12:00:00').getDay()];
const lab=i=>'Noite de '+wd(i)+' '+br(i);
const now=new Date(),h=now.getHours(),yest=new Date(now);yest.setDate(now.getDate()-1);
let ui={tab:'c',mode:h<12?'m':'n',cy:iso(h<12?yest:now),conf:null};
const get=(c,id,k)=>{const d=S.days[c];return d&&d[id]&&d[id][k]!==undefined?d[id][k]:undefined};
function set(c,id,k,v){S.days[c]=S.days[c]||{};S.days[c][id]=S.days[c][id]||{};if(v===undefined)delete S.days[c][id][k];else S.days[c][id][k]=v;save()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}

const money=x=>'R$ '+x.toFixed(2).replace('.',',');
const pr=p=>p.price||0;
const f=x=>x===undefined?'–':x;
function calc(c,p){const r={n:get(c,p.id,'n'),m:get(c,p.id,'m'),v:get(c,p.id,'v')};
  if(r.n!==undefined&&r.m!==undefined){r.d=r.n-r.m;if(r.d>=0&&r.v!==undefined)r.l=r.d-r.v}
  return r}
const HINT={n:'Conte o que tem na geladeira antes de ir embora.',m:'Conte o que tem na geladeira ao chegar.',v:'Quantas unidades foram vendidas (veja no relatório da maquininha ou do sistema).'};
function vCount(){
  const act=S.products.filter(p=>!p.off);let T={n:0,m:0,s:0,v:0,l:0,rv:0,rl:0,sc:0},bad=0,nop=0;
  const rows=act.map(p=>{
    const r=calc(ui.cy,p),cur=r[ui.mode];
    if(r.n!==undefined)T.n+=r.n;if(r.m!==undefined)T.m+=r.m;
    let tag='';
    if(r.d!==undefined){
      if(r.d<0||r.l<0){bad++;tag='<span class="tag bad">conferir</span>'}
      else{T.s+=r.d;T.sc+=r.d*pr(p);tag='<span class="tag ok">saiu '+r.d+'</span>';
        if(r.l!==undefined){T.v+=r.v;T.l+=r.l;T.rv+=r.v*pr(p);T.rl+=r.l*pr(p);if(!p.price)nop++;
          tag+=r.l>0?'<span class="tag bad">perda '+r.l+'</span>':'<span class="tag ok">sem perda</span>'}}
    }
    return '<div class="row"><div class="nm">'+esc(p.name)+'<small>Noite '+f(r.n)+' · Manhã '+f(r.m)+' · Vendido '+f(r.v)+(p.price?' · '+money(p.price):' · sem preço')+tag+'</small></div><div class="st"><button data-a="dec" data-id="'+p.id+'" aria-label="menos">−</button><input type="number" inputmode="numeric" min="0" placeholder="–" data-a="inp" data-id="'+p.id+'" value="'+(cur===undefined?'':cur)+'"><button data-a="inc" data-id="'+p.id+'" aria-label="mais">+</button></div></div>';
  }).join('');
  const rp=S.rep[ui.cy],df=rp===undefined?undefined:rp-T.sc,okd=df!==undefined&&Math.abs(df)<0.005;
  let st='';
  if(df!==undefined)st=okd?'<div class="tag ok" style="display:block;margin:10px 0 0;padding:8px">Bateu: contagem e relatório estão iguais ✔</div>':'<div class="tag bad" style="display:block;margin:10px 0 0;padding:8px">'+(df<0?'O relatório está '+money(-df)+' a menos que a contagem: saiu produto sem venda registrada.':'O relatório está '+money(df)+' a mais que a contagem: confira a contagem e os preços.')+'</div>';
  const conf='<div class="card"><b>Conferência com o relatório</b><p class="sub" style="margin:4px 0 8px">Venda pela contagem = saiu × preço de venda.</p><div class="sum"><div><b>'+money(T.sc)+'</b><span>Pela contagem</span></div><div><b>'+(rp===undefined?'–':money(rp))+'</b><span>Relatório</span></div><div><b style="color:'+(df===undefined?'var(--tx)':okd?'var(--ok)':'var(--bad)')+'">'+(df===undefined?'–':money(df))+'</b><span>Diferença</span></div></div><label for="rep" style="margin-top:10px">Venda do relatório (R$)</label><input type="text" inputmode="decimal" id="rep" placeholder="0,00" value="'+(rp===undefined?'':String(rp).replace('.',','))+'">'+st+'</div>';
  const M=[['n','🌙 Noite'],['m','☀️ Manhã'],['v','🧾 Vendido']];
  return '<div class="card"><label for="cy">Contagem da noite de</label><input type="date" id="cy" value="'+ui.cy+'"><div class="seg">'+M.map(x=>'<button data-a="mode" data-m="'+x[0]+'" class="'+(ui.mode===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div><p class="sub" style="margin:8px 0 0">'+HINT[ui.mode]+'</p></div>'
   +'<div class="card"><div class="sum"><div><b>'+T.n+'</b><span>Noite</span></div><div><b>'+T.m+'</b><span>Manhã</span></div><div><b>'+T.s+'</b><span>Saiu</span></div></div>'
   +'<div class="sum" style="margin-top:8px"><div><b>'+T.v+'</b><span>Vendido (un)</span></div><div><b>'+T.l+'</b><span>Perda (un)</span></div></div>'
   +'<div class="sum" style="margin-top:8px"><div><b>'+money(T.rv)+'</b><span>Vendido (R$)</span></div><div><b style="color:var(--bad)">'+money(T.rl)+'</b><span>Perda (R$)</span></div></div></div>'
   +conf
   +(bad?'<div class="card" style="color:var(--bad)">'+bad+' produto(s) para conferir: manhã maior que noite, ou vendido maior que o que saiu.</div>':'')
   +(nop?'<div class="card sub">'+nop+' produto(s) sem preço: cadastre na aba Produtos para valorizar.</div>':'')
   +'<div class="card">'+(rows||'<div class="empty">Nenhum produto. Cadastre na aba Produtos.</div>')+'</div>';
}

function cycles(){return Object.keys(S.days).filter(c=>Object.values(S.days[c]).some(o=>Object.keys(o).length)).sort().reverse()}
function vHist(){
  const cs=cycles();if(!cs.length)return '<div class="card empty">Ainda não há contagens. Comece pela aba Contagem.</div>';
  const agg={},G={s:0,v:0,l:0,rv:0,rl:0,sc:0,rp:0,dc:0};
  const list=cs.map(c=>{
    let ts=0,tv=0,tl=0,rv=0,rl=0,sc=0;
    const rows=S.products.map(p=>{
      const r=calc(c,p);if(r.n===undefined&&r.m===undefined&&r.v===undefined)return '';
      let sd='–',pd='–';
      if(r.d!==undefined){
        if(r.d<0||r.l<0){sd=r.d<0?'conferir':r.d;pd=r.l<0?'conferir':'–'}
        else{sd=r.d;ts+=r.d;sc+=r.d*pr(p);const a=agg[p.id]=agg[p.id]||{s:0,v:0,l:0,rv:0,rl:0};a.s+=r.d;
          if(r.l!==undefined){pd=r.l;tv+=r.v;tl+=r.l;rv+=r.v*pr(p);rl+=r.l*pr(p);a.v+=r.v;a.l+=r.l;a.rv+=r.v*pr(p);a.rl+=r.l*pr(p)}}
      }
      return '<tr><td>'+esc(p.name)+'</td><td>'+f(r.n)+'</td><td>'+f(r.m)+'</td><td><b>'+sd+'</b></td><td>'+f(r.v)+'</td><td><b>'+pd+'</b></td></tr>';
    }).join('');
    if(S.rep[c]!==undefined){G.sc+=sc;G.rp+=S.rep[c];G.dc++}
    G.s+=ts;G.v+=tv;G.l+=tl;G.rv+=rv;G.rl+=rl;
    return '<details><summary>'+lab(c)+' · contagem '+money(sc)+(S.rep[c]!==undefined?' · relatório '+money(S.rep[c])+' · dif '+money(S.rep[c]-sc):'')+' · perda '+money(rl)+'</summary><div style="overflow-x:auto"><table><tr><th>Produto</th><th>Noite</th><th>Manhã</th><th>Saiu</th><th>Vend.</th><th>Perda</th></tr>'+rows+'</table></div></details>';
  }).join('');
  const res=S.products.filter(p=>agg[p.id]).sort((a,b)=>agg[b.id].rl-agg[a.id].rl||agg[b.id].l-agg[a.id].l).map(p=>{const a=agg[p.id];return '<tr><td>'+esc(p.name)+'</td><td>'+a.s+'</td><td>'+a.v+'</td><td>'+a.l+'</td><td>'+money(a.rv)+'</td><td><b>'+money(a.rl)+'</b></td></tr>'}).join('');
  const TR='<tr style="font-weight:700;background:var(--sel)"><td>TOTAL</td><td>'+G.s+'</td><td>'+G.v+'</td><td>'+G.l+'</td><td>'+money(G.rv)+'</td><td>'+money(G.rl)+'</td></tr>';
  const pct=G.v+G.l>0?(G.l/(G.v+G.l)*100).toFixed(1).replace('.',',')+'%':'–';
  return '<div class="card"><b>Total geral</b><div class="sum" style="margin-top:8px"><div><b>'+money(G.rv)+'</b><span>Vendido</span></div><div><b style="color:var(--bad)">'+money(G.rl)+'</b><span>Perda</span></div><div><b>'+pct+'</b><span>Perda sobre o total</span></div></div>'+(G.dc?'<div class="sum" style="margin-top:8px"><div><b>'+money(G.sc)+'</b><span>Contagem ('+G.dc+' dia(s) com relatório)</span></div><div><b>'+money(G.rp)+'</b><span>Relatório</span></div><div><b style="color:'+(Math.abs(G.rp-G.sc)<0.005?'var(--ok)':'var(--bad)')+'">'+money(G.rp-G.sc)+'</b><span>Diferença</span></div></div>':'')+'<p class="sub" style="margin:8px 0 0">Perda = saiu − vendido, a preço de venda. Só entram dias com noite, manhã e vendido preenchidos.</p></div>'
   +'<div class="card"><b>Resumo por produto</b><div style="overflow-x:auto"><table><tr><th>Produto</th><th>Saiu</th><th>Vend.</th><th>Perda</th><th>R$ vend.</th><th>R$ perda</th></tr>'+(res?res+TR:'<tr><td colspan="6" class="empty">Preencha noite, manhã e vendido para ver o resumo.</td></tr>')+'</table></div></div>'
   +'<div class="card"><b>Dia a dia</b>'+list+'<button class="btn alt" data-a="csv">Copiar histórico (CSV)</button></div>';
}

function vProd(){
  const rows=S.products.filter(p=>!p.off).map(p=>'<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="pr"><input type="text" data-a="ren" data-id="'+p.id+'" value="'+esc(p.name)+'"><button class="st del" style="height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--card)" data-a="rm" data-id="'+p.id+'">'+(ui.conf===p.id?'Tem certeza?':'Remover')+'</button></div><div class="pr"><div style="flex:1"><label>Preço de venda (R$)</label><input type="text" inputmode="decimal" placeholder="0,00" data-a="price" data-id="'+p.id+'" value="'+(p.price?String(p.price).replace('.',','):'')+'"></div><div style="flex:1"><label>Custo (R$, opcional)</label><input type="text" inputmode="decimal" placeholder="0,00" data-a="cost" data-id="'+p.id+'" value="'+(p.cost?String(p.cost).replace('.',','):'')+'"></div></div></div>').join('');
  return '<div class="card"><b>Produtos da geladeira</b><p class="sub">Toque no nome para editar. O preço de venda valoriza vendas e perdas. Produtos removidos continuam no histórico.</p>'+rows
   +'<div class="pr" style="margin-top:8px"><input type="text" id="newp" placeholder="Novo produto"><button class="btn" style="width:auto;margin:0;padding:12px 16px" data-a="add">Adicionar</button></div></div>';
}

function render(){
  $('#nav').innerHTML=[['c','Contagem'],['h','Histórico'],['p','Preços']].map(t=>'<button data-a="tab" data-t="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
  $('#app').innerHTML=ui.tab==='c'?vCount():ui.tab==='h'?vHist():vProd();
}
function csv(){
  const L=['data_da_noite;produto;noite;manhã;saiu;vendido;perda;preco_venda;valor_vendido;valor_perda'];
  cycles().slice().reverse().forEach(c=>S.products.forEach(p=>{const r=calc(c,p);if(r.n===undefined&&r.m===undefined&&r.v===undefined)return;
    const x=n=>n===undefined?'':n,ok=r.l!==undefined&&r.l>=0;
    L.push([c,p.name,x(r.n),x(r.m),x(r.d),x(r.v),x(r.l),p.price||'',ok?(r.v*pr(p)).toFixed(2):'',ok?(r.l*pr(p)).toFixed(2):''].join(';'))}));
  return L.join('\n');
}
function copy(t){
  try{navigator.clipboard.writeText(t).then(()=>toast('Histórico copiado'),()=>fb(t))}catch(e){fb(t)}
  function fb(x){try{const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Histórico copiado')}catch(e){toast('Não foi possível copiar')}}
}
function addProd(){
  const i=$('#newp'),v=i.value.trim();if(!v)return;
  S.products.push({id:'p'+Date.now(),name:v});save();render();toast('Produto adicionado');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){ui.tab=b.dataset.t;ui.conf=null;render()}
  else if(a==='mode'){ui.mode=b.dataset.m;render()}
  else if(a==='inc'){const c=get(ui.cy,id,ui.mode);set(ui.cy,id,ui.mode,(c===undefined?0:c)+1);render()}
  else if(a==='dec'){const c=get(ui.cy,id,ui.mode);set(ui.cy,id,ui.mode,c===undefined?0:Math.max(0,c-1));render()}
  else if(a==='csv')copy(csv());
  else if(a==='add')addProd();
  else if(a==='rm'){if(ui.conf===id){const p=S.products.find(x=>x.id===id);if(p)p.off=true;ui.conf=null;save();render()}else{ui.conf=id;render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(t.id==='cy'){if(t.value){ui.cy=t.value;render()}}
  else if(t.id==='rep'){const n=parseFloat(t.value.replace(',','.'));if(n>=0)S.rep[ui.cy]=Math.round(n*100)/100;else delete S.rep[ui.cy];save();render()}
  else if(a==='inp'){const v=t.value.trim();set(ui.cy,t.dataset.id,ui.mode,v===''?undefined:Math.max(0,Math.floor(+v)||0));render()}
  else if(a==='price'||a==='cost'){const p=S.products.find(x=>x.id===t.dataset.id),n=parseFloat(t.value.replace(',','.'));if(p){if(n>0)p[a]=Math.round(n*100)/100;else delete p[a];save();t.value=p[a]?String(p[a]).replace('.',','):''}}
  else if(a==='ren'){const p=S.products.find(x=>x.id===t.dataset.id),v=t.value.trim();if(p&&v){p.name=v;save()}else if(p)t.value=p.name}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newp')addProd()});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
